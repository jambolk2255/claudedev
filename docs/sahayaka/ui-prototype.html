<!doctype html>
<html lang="si">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sahayaka UI Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef0f6;
        --surface: #ffffff;
        --surface-2: #f5f6fb;
        --text: #151826;
        --muted: #6b7088;
        --line: #e4e6ef;
        --brand: #5b4bdb;
        --brand-2: #8a7cff;
        --brand-soft: #ece9ff;
        --red: #e5484d;
        --red-soft: #fdecec;
        --amber: #d97706;
        --amber-soft: #fff4e0;
        --green: #16a34a;
        --green-soft: #e7f7ec;
        --a-agency: #5b4bdb;
        --a-business: #0e9f8f;
        --a-education: #d97706;
        --a-personal: #db2777;
        --a-finance: #2563eb;
        --shadow: 0 10px 30px rgba(21, 24, 38, 0.1);
        --font: "Noto Sans Sinhala", "Inter", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0c12;
          --surface: #161824;
          --surface-2: #1d2030;
          --text: #eceef7;
          --muted: #9499b3;
          --line: #2a2e42;
          --brand-soft: #2a2550;
          --red-soft: #3a1c20;
          --amber-soft: #3a2a12;
          --green-soft: #15301f;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0c12;
        --surface: #161824;
        --surface-2: #1d2030;
        --text: #eceef7;
        --muted: #9499b3;
        --line: #2a2e42;
        --brand-soft: #2a2550;
        --red-soft: #3a1c20;
        --amber-soft: #3a2a12;
        --green-soft: #15301f;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
      }

      /* Desktop layout: notes | phone */
      .page {
        display: grid;
        grid-template-columns: minmax(240px, 320px) auto;
        gap: 40px;
        justify-content: center;
        align-items: start;
        padding: 32px 16px;
      }
      .notes h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .notes p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 16px;
      }
      .notes .list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .notes .list button {
        text-align: left;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 14px;
      }
      .notes .list button.on {
        border-color: var(--brand);
        background: var(--brand-soft);
      }
      .notes .tools {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .chip {
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 13px;
      }

      .phone {
        width: 390px;
        height: 820px;
        border-radius: 44px;
        background: var(--surface-2);
        box-shadow:
          var(--shadow),
          0 0 0 10px #1b1d29;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .status {
        height: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 26px;
        font-size: 13px;
        font-weight: 600;
        font-family: Inter, sans-serif;
        flex: none;
      }
      .screen {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 120px;
        scrollbar-width: none;
      }
      .screen::-webkit-scrollbar {
        display: none;
      }

      @media (max-width: 760px) {
        .page {
          display: block;
          padding: 0;
        }
        .notes {
          display: none;
        }
        .phone {
          width: 100%;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
      }

      /* Common */
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 6px 0 14px;
      }
      .hdr h2 {
        margin: 0;
        font-size: 24px;
      }
      .hdr .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--surface);
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
      }
      .sec {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 18px 2px 8px;
      }
      .sec h3 {
        margin: 0;
        font-size: 15px;
      }
      .sec span {
        font-size: 12px;
        color: var(--muted);
      }
      .card {
        background: var(--surface);
        border-radius: 18px;
        padding: 14px;
        border: 1px solid var(--line);
      }
      .task {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        margin-bottom: 8px;
        min-height: 64px;
      }
      .task .chk {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid var(--line);
        flex: none;
        display: grid;
        place-items: center;
      }
      .task.done .chk {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .task.done .t {
        text-decoration: line-through;
        color: var(--muted);
      }
      .task .body {
        flex: 1;
        min-width: 0;
      }
      .task .t {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.35;
      }
      .task .m {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
        flex-wrap: wrap;
      }
      .task.overdue {
        border-color: color-mix(in srgb, var(--red) 40%, var(--line));
        background: var(--red-soft);
      }
      .task.overdue .when {
        color: var(--red);
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .tag {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
        font-family: Inter, sans-serif;
      }

      /* Briefing hero */
      .hero {
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #fff;
        border-radius: 22px;
        padding: 18px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .hero .ring {
        width: 66px;
        height: 66px;
        flex: none;
      }
      .hero h4 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .hero p {
        margin: 0;
        font-size: 13px;
        opacity: 0.9;
        line-height: 1.5;
      }
      .hero .play {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        font-size: 13px;
        font-weight: 600;
        color: #fff;
      }

      /* Tab bar */
      .tabbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 88px;
        background: var(--surface);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: center;
        padding-bottom: 14px;
      }
      .tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: var(--muted);
      }
      .tab.on {
        color: var(--brand);
        font-weight: 600;
      }
      .mic {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #fff;
        display: grid;
        place-items: center;
        margin: -38px auto 0;
        box-shadow: 0 10px 24px rgba(91, 75, 219, 0.45);
        border: 5px solid var(--surface);
      }

      /* Upcoming day strip */
      .days {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .day {
        flex: none;
        width: 52px;
        padding: 10px 0;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        text-align: center;
      }
      .day b {
        display: block;
        font-size: 18px;
        font-family: Inter, sans-serif;
      }
      .day small {
        font-size: 11px;
        color: var(--muted);
      }
      .day.on {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .day.on small {
        color: #fff;
      }
      .day i {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--red);
        margin: 4px auto 0;
      }

      /* Areas */
      .areas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .area {
        border-radius: 18px;
        padding: 14px;
        color: #fff;
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
      }
      .area h4 {
        margin: 0;
        font-size: 15px;
      }
      .area p {
        margin: 0;
        font-size: 12px;
        opacity: 0.9;
      }
      .area b {
        font-size: 26px;
        font-family: Inter, sans-serif;
      }

      /* Voice overlay */
      .voice {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #17133a, #0b0c12);
        color: #fff;
        display: none;
        flex-direction: column;
        padding: 50px 20px 28px;
        z-index: 5;
      }
      .voice.open {
        display: flex;
      }
      .voice .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        opacity: 0.8;
      }
      .convo {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px 0;
        scrollbar-width: none;
      }
      .bubble {
        max-width: 85%;
        padding: 11px 14px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.5;
      }
      .bubble.me {
        align-self: flex-end;
        background: rgba(255, 255, 255, 0.12);
        border-bottom-right-radius: 6px;
      }
      .bubble.ai {
        align-self: flex-start;
        background: var(--brand);
        border-bottom-left-radius: 6px;
      }
      .action-card {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 10px 12px;
        font-size: 13px;
        width: 85%;
      }
      .action-card b {
        display: block;
        font-size: 14px;
        margin-bottom: 2px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 14px;
      }
      .chips button {
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 14px;
      }
      .wave {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        height: 44px;
        margin-bottom: 14px;
      }
      .wave span {
        width: 5px;
        border-radius: 3px;
        background: var(--brand-2);
        animation: w 1s ease-in-out infinite;
      }
      .wave.idle span {
        animation: none;
        height: 6px !important;
        opacity: 0.5;
      }
      @keyframes w {
        0%,
        100% {
          height: 8px;
        }
        50% {
          height: 40px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave span {
          animation: none;
          height: 16px;
        }
      }
      .voice .bigmic {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        margin: 0 auto;
        display: grid;
        place-items: center;
        color: #fff;
        box-shadow:
          0 0 0 10px rgba(138, 124, 255, 0.18),
          0 0 0 22px rgba(138, 124, 255, 0.08);
      }
      .voice .hint {
        text-align: center;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 12px;
      }

      /* Detail / settings rows */
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row .k {
        color: var(--muted);
        width: 96px;
        flex: none;
        font-size: 13px;
      }
      .row .v {
        flex: 1;
      }
      .group {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }
      .toggle {
        width: 44px;
        height: 26px;
        border-radius: 999px;
        background: var(--brand);
        position: relative;
        flex: none;
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        right: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
      }
      .toggle.off {
        background: var(--line);
      }
      .toggle.off::after {
        right: auto;
        left: 3px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 52px;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        width: 100%;
      }
      .btn.primary {
        background: var(--brand);
        color: #fff;
      }
      .btn.ghost {
        background: var(--surface);
        border: 1px solid var(--line);
      }

      /* Bars */
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 130px;
        padding-top: 8px;
      }
      .bars div {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
        height: 100%;
        justify-content: flex-end;
      }
      .bars i {
        width: 100%;
        border-radius: 6px 6px 3px 3px;
        background: var(--brand);
        display: block;
      }
      .bars i.miss {
        background: var(--red);
        opacity: 0.8;
      }
      .stat-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
      }
      .stat b {
        font-size: 22px;
        font-family: Inter, sans-serif;
        display: block;
      }
      .stat small {
        color: var(--muted);
        font-size: 12px;
      }
      .meter {
        height: 8px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 6px;
      }
      .meter i {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      /* WhatsApp */
      .wa {
        background: #0b141a;
        margin: 0 -18px;
        min-height: 100%;
        padding: 12px 14px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .wa .h {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #e9edef;
        padding: 4px 4px 10px;
        border-bottom: 1px solid #222d34;
        margin-bottom: 6px;
      }
      .wa .m {
        max-width: 82%;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.45;
        color: #e9edef;
      }
      .wa .in {
        background: #202c33;
        align-self: flex-start;
      }
      .wa .out {
        background: #005c4b;
        align-self: flex-end;
      }
      .wa .vn {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 200px;
      }
      .wa .vn i {
        flex: 1;
        height: 3px;
        background: #8696a0;
        border-radius: 2px;
      }
      .wa time {
        display: block;
        text-align: right;
        font-size: 10px;
        color: #8696a0;
        margin-top: 2px;
      }

      /* Notification */
      .notif {
        background: var(--surface);
        border-radius: 20px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .notif .app {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .notif .app span {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--brand);
        display: inline-block;
      }
      .notif h5 {
        margin: 6px 0 2px;
        font-size: 14px;
      }
      .notif p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .notif .acts {
        display: flex;
        gap: 18px;
        margin-top: 10px;
        font-size: 13px;
        color: var(--brand);
        font-weight: 600;
      }
      .lock {
        background: linear-gradient(160deg, #2b2470, #0e0f1a);
        margin: 0 -18px;
        min-height: 100%;
        padding: 30px 14px;
        color: #fff;
      }
      .lock .time {
        text-align: center;
        font-size: 64px;
        font-weight: 300;
        font-family: Inter, sans-serif;
      }
      .lock .date {
        text-align: center;
        opacity: 0.8;
        margin-bottom: 30px;
      }
      .lock .notif {
        margin-bottom: 10px;
        color: var(--text);
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <aside class="notes">
        <h1>Sahayaka — UI prototype</h1>
        <p>
          Voice-first task & life manager. Screens click කරලා බලන්න — මැද තියෙන 🎤 button එක press කරාම voice assistant demo එක play වෙනවා (සිංහල voice එක
          browser එකේ තියෙනවා නම් කියවනවා).
        </p>
        <div class="list" id="screenList"></div>
        <div class="tools">
          <button class="chip" id="themeBtn">🌓 Theme</button>
          <button class="chip" id="voiceBtn">🎤 Voice demo</button>
        </div>
      </aside>

      <div class="phone" id="phone">
        <div class="status"><span>9:41</span><span>●●● ▮</span></div>
        <div class="screen" id="screen"></div>

        <nav class="tabbar" id="tabbar">
          <button class="tab" data-go="today">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z" /></svg
            >අද
          </button>
          <button class="tab" data-go="upcoming">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="17" rx="3" />
              <path d="M3 9h18M8 2v4M16 2v4" /></svg
            >ඉදිරියට
          </button>
          <button aria-label="Talk to assistant" class="mic" id="micBtn">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v4" />
            </svg>
          </button>
          <button class="tab" data-go="team">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="8" r="3.5" />

      <div class="row"><span class="v">Evening review</span><span class="sub">8:00 PM</span></div>
      <div class="row"><span class="v">Overdue මතක් කිරීම</span><span class="sub">හැම පැය 2කට</span></div>
      <div class="row"><span class="v">Quiet hours</span><span class="sub">10 PM – 6 AM</span></div>
    </div>
    <div class="sec"><h3>Integrations (n8n)</h3><span>3 actions</span></div>
    <div class="group" style="margin-bottom:12px">
      <div class="row">⚡<span class="v">Client onboarding<div class="sub" style="font-size:12px">"onboarding start කරන්න"</div></span><span class="toggle"></span></div>
      <div class="row">⚡<span class="v">Monthly client report<div class="sub" style="font-size:12px">"report එක generate කරන්න"</div></span><span class="toggle"></span></div>
      <div class="row">⚡<span class="v">New lead → task<div class="sub" style="font-size:12px">inbound webhook</div></span><span class="toggle"></span></div>
      <div class="row">🔑<span class="v">API keys & webhooks</span>›</div>
    </div>
    <div class="group"><div class="row">👥<span class="v">Team & invites</span>›</div><div class="row">💳<span class="v">Plan & billing</span><span class="sub">later</span></div></div>`,
      };

      /* ---------- Voice demo ---------- */
      const SCRIPT = [
        { me: "හෙට උදේ 10ට ABC client එක්ක meeting එකක් තියෙනවා" },
        { ai: "හරි. කීයට මතක් කරන්නද?", ask: ["පැයකට කලින්", "30 min කලින්", "එපා"] },
        { me: "පැයකට කලින්" },
        { card: ["📅 ABC client meeting", "හෙට 10:00 AM · Agency · 9:00ට මතක් කරනවා"] },
        { ai: "දැම්මා. හෙට 9ට මතක් කරනවා. තව මොනවා හරි?" },
        { me: "අද කරන්න ඉතුරු මොනවද?" },
        { ai: "ඉවර නොකළ 2ක් තියෙනවා — Perera Holdings invoice එක, සහ Assignment 3. අදට තව 3ක් තියෙනවා." },
        { me: "Invoice එක යැව්වා, complete කරන්න" },
        { card: ["✅ Perera Holdings invoice", "Complete · Undo"] },
        { ai: "හරි, invoice එක complete. අදට තව 3ක් ඉතුරුයි. 👍", ask: ["ස්තූතියි", "Briefing එක කියවන්න"] },
      ];

      let timers = [];
      function speak(text) {
        try {
          if (!("speechSynthesis" in window)) return;
          const u = new SpeechSynthesisUtterance(text);
          const voices = speechSynthesis.getVoices();
          const si = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("si"));
          if (si) {
            u.voice = si;
            u.lang = si.lang;
          } else {
            u.lang = "si-LK";
          }
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        } catch (e) {
          /* speech is optional in the prototype */
        }
      }

      function setWave(active) {
        const w = $("#wave");
        w.classList.toggle("idle", !active);
      }

      function openVoice() {
        timers.forEach(clearTimeout);
        timers = [];
        const convo = $("#convo"),
          chips = $("#chips");
        convo.innerHTML = "";
        chips.innerHTML = "";
        $("#voice").classList.add("open");
        let t = 300;
        SCRIPT.forEach((s) => {
          timers.push(
            setTimeout(() => {
              chips.innerHTML = "";
              let el;
              if (s.me) {
                el = Object.assign(document.createElement("div"), { className: "bubble me", textContent: s.me });
                setWave(true);
              }
              if (s.ai) {
                el = Object.assign(document.createElement("div"), { className: "bubble ai", textContent: s.ai });
                setWave(false);
                speak(s.ai);
              }
              if (s.card) {
                el = document.createElement("div");
                el.className = "action-card";
                el.innerHTML = `<b>${s.card[0]}</b>${s.card[1]}`;
              }
              convo.appendChild(el);
              if (s.ask) chips.innerHTML = s.ask.map((a) => `<button>${a}</button>`).join("");
              convo.scrollTop = convo.scrollHeight;
            }, t),
          );
          t += s.ai ? 2600 : s.card ? 900 : 1500;
        });
        timers.push(setTimeout(() => setWave(false), t));
      }

      function closeVoice() {
        timers.forEach(clearTimeout);
        timers = [];
        try {
          speechSynthesis.cancel();
        } catch (e) {}
        $("#voice").classList.remove("open");
      }

      /* ---------- Navigation ---------- */
      function go(name) {
        if (name === "voice") {
          openVoice();
          return;
        }
        closeVoice();
        current = name;
        screenEl.innerHTML = VIEWS[name]();
        screenEl.scrollTop = 0;
        document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.go === name));
        document.querySelectorAll("#screenList button").forEach((b) => b.classList.toggle("on", b.dataset.s === name));
        const bb = $("#briefBtn");
        if (bb)
          bb.onclick = () =>
            speak(
              "සුබ උදෑසනක්! අද කරන්න tasks පහක් තියෙනවා. උදේ දහයට ABC client meeting එක. ඊයේ ඉවර නොකළ දෙකක් තියෙනවා: Perera Holdings invoice එක සහ Assignment තුන.",
            );
        try {
          localStorage.setItem("sahayaka-screen", name);
        } catch (e) {}
      }

      $("#screenList").innerHTML = SCREENS.map(([k, l]) => `<button data-s="${k}">${l}</button>`).join("");
      $("#screenList").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) go(b.dataset.s);
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-go]");
        if (b) go(b.dataset.go);
      });
      $("#micBtn").onclick = openVoice;
      $("#voiceBtn").onclick = openVoice;
      $("#closeVoice").onclick = closeVoice;
      $("#wave").innerHTML = Array.from({ length: 18 }, (_, i) => `<span style="animation-delay:${(i % 6) * 0.12}s"></span>`).join("");
      setWave(false);
      $("#themeBtn").onclick = () => {
        const r = document.documentElement;
        const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.dataset.theme = dark ? "light" : "dark";
      };

      let start = location.hash.slice(1);
      if (!VIEWS[start] && start !== "voice") {
        try {
          start = localStorage.getItem("sahayaka-screen") || "today";
        } catch (e) {
          start = "today";
        }
      }
      go(VIEWS[start] ? start : "today");
      if (start === "voice") openVoice();
      addEventListener("hashchange", () => {
        const h = location.hash.slice(1);
        if (VIEWS[h] || h === "voice") go(h);
      });
    </script>
  </body>
</html>
