<!doctype html>
<html lang="si">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agent X Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Agent X palette: royal blue + near-black + white. Dark is the default. */
      :root {
        --bg: #0b0d12;
        --surface: #141821;
        --surface-2: #1b2030;
        --line: #262c3b;
        --text: #ffffff;
        --muted: #9aa3b5;
        --brand: #2d5bff;
        --brand-2: #5b7cff;
        --brand-soft: rgba(45, 91, 255, 0.16);
        --on-brand: #ffffff;
        --red: #ff4d4f;
        --red-soft: rgba(255, 77, 79, 0.12);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        --frame: #000000;
        --font: "Noto Sans Sinhala", "Inter", system-ui, sans-serif;
      }
      :root[data-theme="light"] {
        --bg: #ffffff;
        --surface: #f4f6fa;
        --surface-2: #e9edf5;
        --line: #dde2ec;
        --text: #0b0d12;
        --muted: #5b6475;
        --brand-soft: rgba(45, 91, 255, 0.1);
        --red: #e5383b;
        --red-soft: rgba(229, 56, 59, 0.08);
        --shadow: 0 10px 30px rgba(11, 13, 18, 0.12);
        --frame: #0b0d12;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
      }
      button {
        cursor: pointer;
      }

      .page {
        display: grid;
        grid-template-columns: minmax(240px, 320px) auto;
        gap: 40px;
        justify-content: center;
        align-items: start;
        padding: 32px 16px;
      }
      .notes h1 {
        font-size: 24px;
        margin: 0 0 4px;
        font-family: Inter, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .notes h1 b {
        color: var(--brand);
      }
      .notes p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 16px;
      }
      .notes .list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .notes .list button {
        text-align: left;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 14px;
      }
      .notes .list button.on {
        border-color: var(--brand);
        background: var(--brand-soft);
      }
      .notes .tools {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        font-size: 13px;
      }
      .swatches {
        display: flex;
        gap: 6px;
        margin: 4px 0 16px;
      }
      .swatches span {
        flex: 1;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font:
          600 10px Inter,
          sans-serif;
        display: grid;
        place-items: center;
      }

      .phone {
        width: 390px;
        height: 820px;
        border-radius: 44px;
        background: var(--bg);
        box-shadow:
          var(--shadow),
          0 0 0 10px var(--frame),
          0 0 0 11px var(--line);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .status {
        height: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 26px;
        font-size: 13px;
        font-weight: 600;
        font-family: Inter, sans-serif;
        flex: none;
      }
      .screen {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 120px;
        scrollbar-width: none;
      }
      .screen::-webkit-scrollbar {
        display: none;
      }
      @media (max-width: 760px) {
        .page {
          display: block;
          padding: 0;
        }
        .notes {
          display: none;
        }
        .phone {
          width: 100%;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
      }

      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 6px 0 14px;
        gap: 10px;
      }
      .hdr h2 {
        margin: 0;
        font-size: 24px;
      }
      .hdr .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .brandmark {
        font:
          800 13px Inter,
          sans-serif;
        letter-spacing: 1.5px;
        color: var(--brand);
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--surface);
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        flex: none;
      }
      .sec {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 18px 2px 8px;
      }
      .sec h3 {
        margin: 0;
        font-size: 15px;
      }
      .sec span {
        font-size: 12px;
        color: var(--muted);
      }
      .card {
        background: var(--surface);
        border-radius: 18px;
        padding: 14px;
        border: 1px solid var(--line);
      }
      .task {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        margin-bottom: 8px;
        min-height: 64px;
        width: 100%;
        text-align: left;
      }
      .task .chk {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid var(--line);
        flex: none;
        display: grid;
        place-items: center;
        font-size: 14px;
      }
      .task.done .chk {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--on-brand);
      }
      .task.done .t {
        text-decoration: line-through;
        color: var(--muted);
      }
      .task .body {
        flex: 1;
        min-width: 0;
      }
      .task .t {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.35;
        display: block;
      }
      .task .m {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        flex-wrap: wrap;
      }
      .task.overdue {
        border-color: color-mix(in srgb, var(--red) 55%, var(--line));
        background: var(--red-soft);
      }
      .task.overdue .chk {
        border-color: var(--red);
      }
      .task.overdue .when {
        color: var(--red);
        font-weight: 600;
      }
      .tag {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: var(--brand-soft);
        color: var(--brand-2);
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      :root[data-theme="light"] .tag {
        color: var(--brand);
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--surface-2);
        color: var(--text);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
        font-family: Inter, sans-serif;
        border: 1px solid var(--line);
      }

      .hero {
        background: var(--brand);
        color: var(--on-brand);
        border-radius: 22px;
        padding: 18px;
        display: flex;
        gap: 14px;
        align-items: center;
        position: relative;
        overflow: hidden;
      }
      .hero::after {
        content: "";
        position: absolute;
        right: -40px;
        top: -40px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }
      .hero .ring {
        width: 66px;
        height: 66px;
        flex: none;
      }
      .hero h4 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .hero p {
        margin: 0;
        font-size: 13px;
        opacity: 0.92;
        line-height: 1.5;
      }
      .hero .play {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        background: #0b0d12;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        position: relative;
        z-index: 1;
      }

      .tabbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 88px;
        background: var(--surface);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: center;
        padding-bottom: 14px;
      }
      .tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: var(--muted);
      }
      .tab.on {
        color: var(--brand-2);
        font-weight: 600;
      }
      :root[data-theme="light"] .tab.on {
        color: var(--brand);
      }
      .mic {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--brand);
        color: var(--on-brand);
        display: grid;
        place-items: center;
        margin: -38px auto 0;
        box-shadow: 0 10px 24px rgba(45, 91, 255, 0.45);
        border: 5px solid var(--bg);
      }

      .days {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .day {
        flex: none;
        width: 52px;
        padding: 10px 0;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        text-align: center;
      }
      .day b {
        display: block;
        font-size: 18px;
        font-family: Inter, sans-serif;
      }
      .day small {
        font-size: 11px;
        color: var(--muted);
      }
      .day.on {
        background: var(--brand);
        color: var(--on-brand);
        border-color: var(--brand);
      }
      .day.on small {
        color: var(--on-brand);
      }
      .day i {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--red);
        margin: 4px auto 0;
      }

      .areas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .area {
        border-radius: 18px;
        padding: 14px;
        min-height: 112px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .area .ic {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        font-size: 18px;
      }
      .area h4 {
        margin: 8px 0 0;
        font-size: 15px;
      }
      .area p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .area b {
        font-size: 24px;
        font-family: Inter, sans-serif;
      }
      .area .od {
        color: var(--red);
      }

      .voice {
        position: absolute;
        inset: 0;
        background: #0b0d12;
        color: #fff;
        display: none;
        flex-direction: column;
        padding: 50px 20px 28px;
        z-index: 5;
      }
      .voice::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -160px;
        width: 520px;
        height: 420px;
        transform: translateX(-50%);
        background: radial-gradient(closest-side, rgba(45, 91, 255, 0.35), transparent);
        pointer-events: none;
      }
      .voice.open {
        display: flex;
      }
      .voice .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: #9aa3b5;
        position: relative;
      }
      .convo {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px 0;
        scrollbar-width: none;
        position: relative;
      }
      .bubble {
        max-width: 85%;
        padding: 11px 14px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.5;
      }
      .bubble.me {
        align-self: flex-end;
        background: #1b2030;
        border-bottom-right-radius: 6px;
      }
      .bubble.ai {
        align-self: flex-start;
        background: var(--brand);
        border-bottom-left-radius: 6px;
      }
      .action-card {
        align-self: flex-start;
        background: #141821;
        border: 1px solid #262c3b;
        border-radius: 14px;
        padding: 10px 12px;
        font-size: 13px;
        width: 85%;
        color: #9aa3b5;
      }
      .action-card b {
        display: block;
        font-size: 14px;
        margin-bottom: 2px;
        color: #fff;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 14px;
        position: relative;
      }
      .chips button {
        padding: 9px 16px;
        border-radius: 999px;
        background: #1b2030;
        border: 1px solid #262c3b;
        color: #fff;
        font-size: 14px;
      }
      .wave {
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        height: 44px;
        margin-bottom: 14px;
        position: relative;
      }
      .wave span {
        width: 5px;
        border-radius: 3px;
        background: #5b7cff;
        animation: w 1s ease-in-out infinite;
      }
      .wave.idle span {
        animation: none;
        height: 6px !important;
        opacity: 0.5;
      }
      @keyframes w {
        0%,
        100% {
          height: 8px;
        }
        50% {
          height: 40px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave span {
          animation: none;
          height: 16px;
        }
      }
      .voice .bigmic {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: var(--brand);
        margin: 0 auto;
        display: grid;
        place-items: center;
        color: #fff;
        box-shadow:
          0 0 0 10px rgba(45, 91, 255, 0.2),
          0 0 0 22px rgba(45, 91, 255, 0.08);
        position: relative;
      }
      .voice .hint {
        text-align: center;
        font-size: 12px;
        color: #9aa3b5;
        margin-top: 12px;
        position: relative;
      }
      .voice .type {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        position: relative;
      }
      .voice .type input {
        flex: 1;
        height: 42px;
        border-radius: 12px;
        background: #141821;
        border: 1px solid #262c3b;
        padding: 0 12px;
        color: #fff;
        font-size: 14px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        width: 100%;
        text-align: left;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row .k {
        color: var(--muted);
        width: 96px;
        flex: none;
        font-size: 13px;
      }
      .row .v {
        flex: 1;
        min-width: 0;
      }
      .row .v small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 1px;
      }
      .group {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }
      .toggle {
        width: 44px;
        height: 26px;
        border-radius: 999px;
        background: var(--brand);
        position: relative;
        flex: none;
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        right: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
      }
      .toggle.off {
        background: var(--line);
      }
      .toggle.off::after {
        right: auto;
        left: 3px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 52px;
        border-radius: 16px;
        font-weight: 600;
        font-size: 15px;
        width: 100%;
      }
      .btn.primary {
        background: var(--brand);
        color: var(--on-brand);
      }
      .btn.ghost {
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .field {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font:
          500 13px Inter,
          sans-serif;
        color: var(--muted);
        margin-top: 6px;
      }
      .ok {
        color: var(--brand-2);
        font-weight: 600;
        font-size: 12px;
      }
      :root[data-theme="light"] .ok {
        color: var(--brand);
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 130px;
        padding-top: 8px;
      }
      .bars div {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: var(--muted);
        height: 100%;
        justify-content: flex-end;
      }
      .bars i {
        width: 100%;
        border-radius: 6px;
        background: var(--brand);
        display: block;
      }
      .bars i.miss {
        background: var(--red);
      }
      .stat-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
      }
      .stat b {
        font-size: 22px;
        font-family: Inter, sans-serif;
        display: block;
      }
      .stat small {
        color: var(--muted);
        font-size: 12px;
      }
      .meter {
        height: 8px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 6px;
      }
      .meter i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: var(--brand);
      }

      .sys {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        margin-bottom: 8px;
        width: 100%;
        text-align: left;
      }
      .sys .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--brand-soft);
        display: grid;
        place-items: center;
        font-size: 20px;
        flex: none;
      }
      .sys .body {
        flex: 1;
        min-width: 0;
      }
      .sys .body b {
        display: block;
        font-size: 15px;
      }
      .sys .body small {
        color: var(--muted);
        font-size: 12px;
      }
      .dotok {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--brand-2);
        display: inline-block;
        margin-right: 4px;
      }
      .flow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 12px;
        text-align: center;
      }
      .flow div {
        flex: 1;
        padding: 10px 4px;
        border-radius: 12px;
        background: var(--surface-2);
        border: 1px solid var(--line);
      }
      .flow div.hub {
        background: var(--brand);
        color: var(--on-brand);
        border-color: var(--brand);
        font-weight: 700;
      }
      .flow span {
        color: var(--muted);
      }

      .notif {
        background: var(--surface);
        border-radius: 20px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        margin-bottom: 10px;
      }
      .notif .app {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .notif .app span {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--brand);
        display: inline-grid;
        place-items: center;
        color: #fff;
        font:
          800 9px Inter,
          sans-serif;
      }
      .notif h5 {
        margin: 6px 0 2px;
        font-size: 14px;
      }
      .notif p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .notif .acts {
        display: flex;
        gap: 18px;
        margin-top: 10px;
        font-size: 13px;
        color: var(--brand-2);
        font-weight: 600;
      }
      :root[data-theme="light"] .notif .acts {
        color: var(--brand);
      }
      .lock {
        margin: 0 -18px;
        min-height: 100%;
        padding: 30px 14px;
        background: radial-gradient(120% 70% at 50% 0%, rgba(45, 91, 255, 0.35), transparent 70%), var(--bg);
      }
      .lock .time {

          ([d, m], i) => `

        )
        .join("")}</div></div>
    <div class="sec"><h3>Area අනුව</h3></div>
    <div class="group">${[
      ["agency", 18, 21],
      ["business", 4, 5],
      ["education", 3, 4],
      ["personal", 4, 6],
      ["finance", 2, 3],
    ]
      .map(
        ([a, d, t]) => `
      <div class="row"><span class="k">${AREAS[a].icon} ${AREAS[a].name}</span><span class="v"><div class="meter"><i style="width:${(d / t) * 100}%"></i></div></span><span class="sub" style="width:44px;text-align:right">${d}/${t}</span></div>`,
      )
      .join("")}</div>`,

        more: () => `
    <div class="hdr"><h2>තව</h2></div>
    <div class="group" style="margin-bottom:12px">
      <button class="row" data-go="areas">🗂 <span class="v">Areas</span>›</button>
      <button class="row" data-go="reports">📊 <span class="v">Reports</span>›</button>
      <div class="row">👥 <span class="v">Team<small>v0.3 — sync server එක්ක</small></span></div>
    </div>
    <div class="sec"><h3>🔑 AI API keys</h3><span>phone එකේ secure storage</span></div>
    <div class="group" style="margin-bottom:12px">
      <div class="row"><span class="v">Gemini (voice → text)<div class="field">AIza••••••••••••3kQ</div></span><span class="ok">✓</span></div>
      <div class="row"><span class="v">Claude (තේරුම් ගැනීම)<div class="field">sk-ant-••••••••••</div></span><span class="ok">✓</span></div>
    </div>
    <div class="sec"><h3>Voice</h3></div>
    <div class="group" style="margin-bottom:12px">
      <div class="row"><span class="v">භාෂාව</span><span class="sub">සිංහල + English</span></div>
      <div class="row"><span class="v">Replies කියවන්න</span><span class="toggle"></span></div>
      <div class="row"><span class="v">Theme</span><span class="sub">Dark</span></div>
    </div>
    <div class="sec"><h3>Reminders</h3></div>
    <div class="group" style="margin-bottom:12px">
      <div class="row"><span class="v">Morning briefing</span><span class="sub">7:00 AM</span></div>
      <div class="row"><span class="v">Evening review</span><span class="sub">8:00 PM</span></div>
      <div class="row"><span class="v">Overdue මතක් කිරීම</span><span class="sub">හැම පැය 2කට</span></div>
      <div class="row"><span class="v">Quiet hours</span><span class="sub">10 PM – 6 AM</span></div>
    </div>
    <div class="sec"><h3>💾 Backup</h3><span>අන්තිම: අද 2:00 AM</span></div>
    <div class="group">
      <div class="row"><span class="v">Auto backup → n8n (Google Drive)<small>දිනපතා</small></span><span class="toggle"></span></div>
      <button class="row">⬇ <span class="v">Backup file එකක් save කරන්න</span></button>
      <button class="row">⬆ <span class="v">Backup එකෙන් restore කරන්න</span></button>
    </div>`,
      };

      const SCRIPT = [
        { me: "හෙට උදේ 10ට ABC client එක්ක meeting එකක් තියෙනවා" },
        { ai: "හරි. කීයට මතක් කරන්නද?", ask: ["පැයකට කලින්", "30 min කලින්", "එපා"] },
        { me: "පැයකට කලින්" },
        { card: ["📅 ABC client meeting", "හෙට 10:00 AM · Agency · 9:00ට මතක් කරනවා"] },
        { ai: "දැම්මා. හෙට 9ට මතක් කරනවා. තව මොනවා හරි?" },
        { me: "Perera Holdings onboarding එක start කරන්න" },
        { ai: "Agency CRM එකේ client onboarding workflow එක run කරන්නද?", ask: ["ඔව්", "නෑ"] },
        { me: "ඔව්" },
        { card: ["⚡ Agency CRM · Client onboarding", "n8n: Perera Holdings — folder, invoice & welcome email හැදුවා"] },
        { ai: "හරි, onboarding එක start කළා. Welcome email එක යැව්වා. 👍", ask: ["ස්තූතියි", "අද ඉතුරු මොනවද?"] },
      ];

      let timers = [];
      function speak(text) {
        try {
          if (!("speechSynthesis" in window)) return;
          const u = new SpeechSynthesisUtterance(text);
          const si = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith("si"));
          if (si) {
            u.voice = si;
            u.lang = si.lang;
          } else {
            u.lang = "si-LK";
          }
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        } catch (e) {
          /* speech is optional in the prototype */
        }
      }
      const setWave = (active) => $("#wave").classList.toggle("idle", !active);

      function openVoice() {
        timers.forEach(clearTimeout);
        timers = [];
        const convo = $("#convo"),
          chips = $("#chips");
        convo.innerHTML = "";
        chips.innerHTML = "";
        $("#voice").classList.add("open");
        let t = 300;
        SCRIPT.forEach((s) => {
          timers.push(
            setTimeout(() => {
              chips.innerHTML = "";
              let el;
              if (s.me) {
                el = Object.assign(document.createElement("div"), { className: "bubble me", textContent: s.me });
                setWave(true);
              }
              if (s.ai) {
                el = Object.assign(document.createElement("div"), { className: "bubble ai", textContent: s.ai });
                setWave(false);
                speak(s.ai);
              }
              if (s.card) {
                el = document.createElement("div");
                el.className = "action-card";
                el.innerHTML = `<b>${s.card[0]}</b>${s.card[1]}`;
              }
              convo.appendChild(el);
              if (s.ask) chips.innerHTML = s.ask.map((a) => `<button>${a}</button>`).join("");
              convo.scrollTop = convo.scrollHeight;
            }, t),
          );
          t += s.ai ? 2600 : s.card ? 900 : 1500;
        });
        timers.push(setTimeout(() => setWave(false), t));
      }
      function closeVoice() {
        timers.forEach(clearTimeout);
        timers = [];
        try {
          speechSynthesis.cancel();
        } catch (e) {}
        $("#voice").classList.remove("open");
      }

      const TAB_FOR = {
        today: "today",
        detail: "today",
        notify: "today",
        upcoming: "upcoming",
        systems: "systems",
        system: "systems",
        more: "more",
        areas: "more",
        reports: "more",
      };
      function go(name) {
        if (name === "voice") {
          openVoice();
          return;
        }
        closeVoice();
        screenEl.innerHTML = VIEWS[name]();
        screenEl.scrollTop = 0;
        document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.go === TAB_FOR[name]));
        document.querySelectorAll("#screenList button").forEach((b) => b.classList.toggle("on", b.dataset.s === name));
        const bb = $("#briefBtn");
        if (bb) bb.onclick = () => speak("සුබ උදෑසනක්! අද කරන්න tasks පහක් තියෙනවා. උදේ දහයට ABC client meeting එක. ඊයේ ඉවර නොකළ දෙකක් තියෙනවා.");
        try {
          localStorage.setItem("agentx-screen", name);
        } catch (e) {}
      }

      $("#screenList").innerHTML = SCREENS.map(([k, l]) => `<button data-s="${k}">${l}</button>`).join("");
      $("#screenList").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) go(b.dataset.s);
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-go]");
        if (b) go(b.dataset.go);
      });
      $("#micBtn").onclick = openVoice;
      $("#voiceBtn").onclick = openVoice;
      $("#closeVoice").onclick = closeVoice;
      $("#wave").innerHTML = Array.from({ length: 18 }, (_, i) => `<span style="animation-delay:${(i % 6) * 0.12}s"></span>`).join("");
      setWave(false);
      $("#themeBtn").onclick = () => {
        const r = document.documentElement;
        r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
      };

      const params = new URLSearchParams(location.search);
      if (params.get("theme") === "light") document.documentElement.dataset.theme = "light";
      let start = location.hash.slice(1);
      if (!VIEWS[start] && start !== "voice") {
        try {
          start = localStorage.getItem("agentx-screen") || "today";
        } catch (e) {
          start = "today";
        }
      }
      go(VIEWS[start] ? start : "today");
      if (start === "voice") openVoice();
      addEventListener("hashchange", () => {
        const h = location.hash.slice(1);
        if (VIEWS[h] || h === "voice") go(h);
      });
    </script>
  </body>
</html>
