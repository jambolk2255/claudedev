name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stockflow:stockflow@localhost:5432/stockflow_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-that-is-long-enough-1234567890
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @stockflow/schemas build
      - run: pnpm typecheck
      - run: pnpm --filter @stockflow/schemas test
      - name: API e2e tests
        run: pnpm --filter @stockflow/api test
      - name: Build
        run: pnpm build
      - name: Start API and web
        run: |
          (cd apps/api && ALLOW_MULTI_ORG_SIGNUP=true AUTH_RATE_LIMIT=1000 node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && npx next start -p 3000 > ../../web.log 2>&1 &)
          npx --yes wait-on@8.0.4 -t 60000 http://localhost:4000/api/v1/health http://localhost:3000/login
      - run: pnpm --filter @stockflow/web exec playwright install --with-deps chromium
      - name: Browser e2e tests
        run: pnpm --filter @stockflow/web test:e2e
      - if: failure()
        run: tail -n 200 api.log web.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
