name: Agent X APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/agentx/**"
      - ".github/workflows/agentx-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentx-apk-${{ github.ref }}
  # Queue instead of cancelling: every finished build updates the download link.
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/agentx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/agentx/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      # Own signing key from repository secrets (see docs/agentx/SECURITY.md). Without it the APK is
      # signed with React Native's public debug key, which is fine for testing only.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AGENTX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AGENTX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AGENTX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AGENTX_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::AGENTX_KEYSTORE_BASE64 is not set - signing with the public debug key. Add the signing secrets (docs/agentx/SECURITY.md)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentx.keystore"
          {
            echo "AGENTX_KEYSTORE_FILE=$RUNNER_TEMP/agentx.keystore"
            echo "AGENTX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AGENTX_KEY_ALIAS=$KEY_ALIAS"
            echo "AGENTX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: apps/agentx/android
        # arm64 only keeps the build fast and covers current Android phones.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/agent-x-${GITHUB_SHA::7}.apk"
          # Record which certificate signed the APK in the build log.
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs dist/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: agent-x-apk
          path: apps/agentx/dist/*.apk
          retention-days: 30
      # A fixed release gives a stable phone-friendly link:
      # https://github.com/<owner>/<repo>/releases/download/agentx-latest/agent-x.apk
      - name: Publish to the agentx-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/agent-x-*.apk dist/agent-x.apk
          notes="Latest Agent X build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC')). Download agent-x.apk and open it on your Android phone."
          gh release view agentx-latest >/dev/null 2>&1 || gh release create agentx-latest --prerelease --target "$GITHUB_SHA" --title "Agent X (latest build)" --notes "$notes"
          gh release upload agentx-latest dist/agent-x.apk --clobber
          gh release edit agentx-latest --notes "$notes"
