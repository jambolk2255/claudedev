<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · StockFlow</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7fb; --fg: #18181b; --muted: #71717a; --primary: #5b4bdb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14131f; --fg: #f4f4f5; --muted: #a1a1aa; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Noto Sans Sinhala", sans-serif; }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0 0 0.25rem; }
      button { margin-top: 1.25rem; height: 2.5rem; padding: 0 1.25rem; border: 0; border-radius: 0.6rem; background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="48" height="48" alt="" />
      <h1>You're offline</h1>
      <p>StockFlow needs a connection to show live stock and orders.</p>
      <p>ඔබ නොබැඳි (offline) ය. සම්බන්ධතාවය නැවත ලැබුණු පසු උත්සාහ කරන්න.</p>
      <button onclick="location.reload()">Try again · නැවත උත්සාහ කරන්න</button>
    </main>
  </body>
</html>
