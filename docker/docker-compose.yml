# Local infrastructure:   docker compose -f docker/docker-compose.yml up -d
# Full stack (api + web): docker compose -f docker/docker-compose.yml --profile app up -d --build
name: stockflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_DB: stockflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    environment:
      DATABASE_URL: postgresql://stockflow:stockflow@postgres:5432/stockflow?schema=public
      REDIS_URL: redis://redis:6379
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      CORS_ORIGINS: ${WEB_URL:-http://localhost:3000}
      # Required: set real secrets in a .env file next to this compose file.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (openssl rand -base64 48)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -base64 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # SaaS mode (optional): self sign-up, trials, plans and billing
      SAAS_MODE: ${SAAS_MODE:-false}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      TRIAL_PLAN: ${TRIAL_PLAN:-business}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_SANDBOX: ${PAYHERE_SANDBOX:-true}
      BANK_TRANSFER_DETAILS: ${BANK_TRANSFER_DETAILS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        API_URL: http://api:4000
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]

volumes:
  pgdata:
